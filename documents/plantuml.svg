@startuml
entity "Users" as users {
  + id (PK)
  - -
  full_name
  email
  password_hash
  student_id
  created_at
  updated_at
}

entity "Locations" as locations {
  + id (PK)
  - -
  name
  description
  latitude
  longitude
  type
  image_url
}

entity "Routes" as routes {
  + id (PK)
  - -
  start_location_id (FK)
  end_location_id (FK)
  path_data
  distance
  estimated_time
}

entity "FeedbackReports" as feedback_reports {
  + id (PK)
  - -
  user_id (FK)
  location_id (FK)
  message
  report_type
  created_at
}

entity "UsageLogs" as usage_logs {
  + id (PK)
  - -
  user_id (FK)
  action
  details
  created_at
}

entity "Events" as events {
  + id (PK)
  - -
  title
  description
  location_id (FK)
  start_time
  end_time
  image_url
  created_at
}

'- - - - - - - - - - - - - - - - - - - - Relationships - - - - - - - - - - - - - - - - - - - -

users ||- -o{ feedback_reports : "submits"
users ||- -o{ usage_logs : "generates"
locations ||- -o{ feedback_reports : "reported_on"
locations ||- -o{ routes : "connected_by"
locations ||- -o{ events : "hosts"
@enduml

